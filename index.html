<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiaBank - リアコイン銀行</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    .crimson-gradient { background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%); }
    .vip-card { background: linear-gradient(135deg, #FFFFFF 0%, #FFF1F2 100%); border: 2px solid #FECDD3; }
    .tab-active { background-color: #E11D48; color: #FFFFFF; font-weight: 700; }
    .tab-inactive { background-color: #FFFFFF; color: #475569; }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-white border-b border-rose-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl crimson-gradient flex items-center justify-center text-white font-black text-lg shadow-sm">R</div>
        <div>
          <h1 class="font-black text-lg tracking-tight text-slate-900 leading-none">RiaBank</h1>
          <p class="text-[11px] text-rose-600 font-bold">OFFICIAL COIN BANK</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 font-medium text-slate-600">保存(JSON)</button>
        <label class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 font-medium text-slate-600 cursor-pointer">
          復元
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
        <div class="h-4 w-px bg-slate-200 mx-1"></div>
        <button id="btn-listener-mode" onclick="switchMode('listener')" class="text-xs px-3 py-1.5 rounded-lg font-bold transition tab-active">リスナー画面</button>
        <button id="btn-admin-mode" onclick="requestAdminMode()" class="text-xs px-3 py-1.5 rounded-lg font-bold transition tab-inactive border border-rose-200 flex items-center gap-1">
          <span>🔒 ライバー管理</span>
          <span id="badge-pending" class="hidden bg-rose-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- Listener Switcher Bar -->
    <div class="bg-white rounded-2xl p-3.5 border border-rose-100 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-bold text-slate-500">表示中の口座:</span>
        <select id="listener-select" onchange="changeActiveListener(this.value)" class="text-sm font-bold bg-rose-50/60 border border-rose-200 text-slate-800 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-rose-500"></select>
        <button onclick="openAddListenerModal()" class="text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1.5 rounded-xl border border-rose-200">＋ 新規リスナー追加</button>
      </div>
      <div class="text-xs text-slate-500 font-medium">
        現在の変換レート: <span class="font-bold text-rose-600">1 プレミアム = <span id="rate-display">100</span> リアコイン</span>
      </div>
    </div>

    <!-- LISTENER VIEW -->
    <div id="view-listener" class="space-y-6">
      <!-- Balance Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Standard Ria Coin Card -->
        <div class="crimson-gradient rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">STANDARD CURRENCY</span>
              <h2 class="text-lg font-bold mt-2">リアコイン残高</h2>
            </div>
            <svg class="w-10 h-10 opacity-90" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="18" fill="#FFF" fill-opacity="0.2" stroke="#FFF" stroke-width="2"/>
              <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#FFF" font-weight="900" font-size="16">R</text>
            </svg>
          </div>
          <div class="mt-4 flex items-baseline gap-1.5">
            <span id="bal-rc" class="text-4xl font-black tracking-tight">0</span>
            <span class="text-sm font-bold opacity-90">RC</span>
          </div>
          <p class="text-[11px] opacity-80 mt-2">特典交換・リクエスト等に利用できる通常通貨</p>
        </div>

        <!-- Premium Ria Coin Card -->
        <div class="vip-card rounded-2xl p-5 text-slate-900 shadow-sm relative overflow-hidden">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider bg-rose-600 text-white px-2 py-0.5 rounded-full">VIP RUBY / GOLD</span>
              <h2 class="text-lg font-bold mt-2 text-rose-950">プレミアムリアコイン残高</h2>
            </div>
            <svg class="w-10 h-10" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
              <path d="M12 25L14 15L20 20L26 15L28 25H12Z" fill="#E11D48"/>
            </svg>
          </div>
          <div class="mt-4 flex items-baseline gap-1.5">
            <span id="bal-prc" class="text-4xl font-black tracking-tight text-rose-600">0</span>
            <span class="text-sm font-bold text-rose-700">PRC</span>
          </div>
          <p id="prc-worth" class="text-[11px] text-rose-700 font-medium mt-2">リアコイン換算: 0 RC 相当</p>
        </div>
      </div>

      <!-- Actions Grid -->
      <div class="grid grid-cols-1 md:grid
